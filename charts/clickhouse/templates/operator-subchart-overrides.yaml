{{- /*
  Inject overrides for the altinity-clickhouse-operator subchart.
  This template intentionally renders no resources.
*/ -}}
{{- $overrides := dict }}
{{- with .Values.operator.namespaceOverride }}
  {{- if ne . "" }}
    {{- $_ := set $overrides "namespaceOverride" . }}
  {{- end }}
{{- end }}
{{- $_ := set $overrides "rbac" (dict "namespaceScoped" (default false .Values.operator.rbacNamespaceScoped)) }}
{{- if .Values.operator.watchedNamespaces }}
  {{- $_ := set $overrides "configs" (dict "files" (dict "config.yaml" (dict "watch" (dict "namespaces" .Values.operator.watchedNamespaces)))) }}
{{- end }}
{{- if gt (len $overrides) 0 }}
  {{- $_ := set .Values "operator" (mergeOverwrite (deepCopy .Values.operator) $overrides) }}
{{- end }}
